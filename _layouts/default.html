<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F9FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151B26" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%23C13A28'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-head">
    <a class="wordmark" href="{{ '/' | relative_url }}"><span class="record-mark" aria-hidden="true"></span>{{ site.title }}</a>
    <nav class="site-nav" aria-label="Site">
      <a href="{{ '/' | relative_url }}">index</a>
      <a href="{{ '/about' | relative_url }}">about</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </nav>
  </header>
  <main id="main" class="content">
    {{ content }}
  </main>
  <footer class="site-foot">
    <p><span class="record-mark" aria-hidden="true"></span>{{ site.title }} — an append-only log</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">subscribe via rss</a></p>
  </footer>
</body>
</html>
